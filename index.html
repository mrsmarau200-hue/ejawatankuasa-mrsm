<html lang="ms">
<head>

<title>e-Jawatankuasa MRSM Arau</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
:root{--bg:#f3f6f4;--card:#fff;--tx:#1b2a21;--mut:#5f6f65;--bd:#dfe5e0;--ac:#1f6b4a;--ac2:#14573b;--act:#fff;--red:#b3261e;--redbg:#fbe9e7;--grn:#1f6b4a;--grnbg:#e3f3ea;--amb:#8a5a00;--ambbg:#fff3d6;--blu:#1f4e79;--side:#0f3d2a;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14.5px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.hide{display:none!important}
h1{font-size:21px;margin:0}h2{font-size:15.5px;margin:0 0 10px}
label{display:block;font-size:12.5px;color:var(--mut);margin:10px 0 3px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:#fff;color:var(--tx);font:inherit}
textarea{min-height:90px;resize:vertical}
.btn{padding:10px 16px;border:0;border-radius:9px;background:var(--ac);color:var(--act);font:inherit;font-weight:700;cursor:pointer}
.btn.full{width:100%;margin-top:14px;padding:12px}
.btn:disabled{opacity:.5;cursor:wait}
.btn2{padding:7px 12px;border:1px solid var(--bd);border-radius:8px;background:#fff;color:var(--tx);font:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn2:hover{border-color:var(--ac)}.btn2.red{color:var(--red)}.btn2.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.msg{margin-top:10px;font-size:13px;color:var(--red);min-height:1em}.ok{color:var(--grn)}
.small{font-size:12.5px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
.tag{display:inline-block;padding:1px 9px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap}
.t-hi{background:var(--redbg);color:var(--red)}.t-md{background:var(--ambbg);color:var(--amb)}.t-lo{background:var(--grnbg);color:var(--grn)}.t-bl{background:#e6eef7;color:var(--blu)}.t-gr{background:#eee;color:#666}
/* auth */
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,#14573b 0%,#0d3b28 55%,var(--bg) 55%)}
.auth .card{max-width:380px;width:100%;padding:26px 22px;box-shadow:0 12px 32px rgba(0,0,0,.18)}
.auth .top{text-align:center;margin-bottom:8px}.auth .top img{height:70px}.auth .top p{margin:4px 0 0;color:var(--mut);font-size:13px}
.pw{position:relative}.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--mut);font:inherit;font-size:12px;cursor:pointer;padding:6px}
/* layout */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}.app>div{min-width:0}
.side{background:var(--side);color:#dcefe4;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;z-index:40}
.brand{display:flex;gap:10px;align-items:center;padding:14px 14px 12px;border-bottom:1px solid rgba(255,255,255,.1)}
.brand img{height:40px;background:#fff;border-radius:9px;padding:3px 5px}.brand b{display:block;font-size:14.5px;color:#fff}.brand small{opacity:.7;font-size:11.5px}
.nav{padding:8px 0 16px;flex:1}
.nav .sec{font-size:10.5px;letter-spacing:.8px;color:#8fb5a1;padding:14px 18px 4px;font-weight:700}
.nav a{display:flex;align-items:center;gap:10px;margin:1px 10px;padding:9px 12px;border-radius:9px;color:#dcefe4;cursor:pointer;font-weight:600;font-size:13.5px;text-decoration:none}
.nav a:hover{background:rgba(255,255,255,.08)}.nav a.on{background:#f5b335;color:#2a1d00}
.nav a .ic{width:18px;text-align:center;opacity:.9}
.top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;padding:8px 18px}
.top .pt{font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top select{width:auto;padding:6px 8px}
.top .who{font-size:13px;color:var(--mut);white-space:nowrap}
.burger{display:none;border:1px solid var(--bd);background:#fff;border-radius:8px;padding:5px 10px;font-size:18px;cursor:pointer}
.main{padding:22px 26px 50px;max-width:1500px;width:100%;margin:0 auto}
.ttl{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:16px}.ttl p{margin:3px 0 0}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.tools input,.tools select{width:auto;flex:1;min-width:150px;padding:8px}
.tools .lb{font-size:12.5px;color:var(--mut);white-space:nowrap}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:14px 16px}
.stat b{display:block;font-size:26px;line-height:1.15}.stat span{font-size:13px}.stat i{display:block;font-style:normal;font-size:11.5px;color:var(--mut);margin-top:2px}
.stat.w b{color:var(--amb)}.stat.r b{color:var(--red)}
.wrap{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th,table.t td{text-align:left;padding:8px 9px;border-bottom:1px solid var(--bd);vertical-align:top}
table.t thead th{background:#eef3ef;color:#3d5246;font-size:11.5px;letter-spacing:.4px;text-transform:uppercase;font-weight:700;white-space:nowrap}
table.t th.n,table.t td.n{text-align:right}
table.t tr.clk{cursor:pointer}table.t tr.clk:hover td{background:#f6faf7}
table.t tr.kos td{background:var(--ambbg)}table.t tr.kos .nm{color:var(--amb);font-style:italic}
th.sort{cursor:pointer}
/* charts */
.hb{display:grid;grid-template-columns:minmax(90px,38%) 1fr 44px;gap:8px;align-items:center;font-size:12px;padding:2.5px 0}
.hb .l{text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#334}
.hb .b{height:14px;background:#eef1ef;border-radius:3px;overflow:hidden}.hb .b div{height:100%;border-radius:3px}
.hb .v{font-weight:700;font-size:12px}
.vb{display:flex;align-items:flex-end;gap:6px;height:220px;padding:6px 4px 0;border-bottom:1px solid #ccd}
.vb .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.vb .c div.bar{width:78%;background:var(--blu);border-radius:3px 3px 0 0}
.vb .c span.v{font-size:11px;font-weight:700;margin-bottom:2px}
.vbx{display:flex;gap:6px;padding:4px 4px 0}.vbx div{flex:1;text-align:center;font-size:10.5px;color:var(--mut);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.donut{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center}
.lg{display:flex;align-items:center;gap:6px;font-size:13px;margin:4px 0}.lg i{width:12px;height:12px;border-radius:3px;display:inline-block}
/* modal */
.dlg{position:fixed;inset:0;background:rgba(10,20,15,.5);display:flex;align-items:flex-start;justify-content:center;z-index:80;padding:30px 14px;overflow-y:auto}
.dlg>div{background:#fff;border-radius:14px;padding:18px;max-width:560px;width:100%;box-shadow:0 18px 40px rgba(0,0,0,.25)}
.dlg h2{display:flex;justify-content:space-between;gap:10px}.dlg .x{border:0;background:none;font-size:20px;cursor:pointer;color:var(--mut)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.toast{position:fixed;left:16px;right:16px;bottom:18px;max-width:440px;margin:auto;background:#1b2a21;color:#fff;padding:10px 14px;border-radius:10px;z-index:90;font-size:14px}
.load{padding:40px;text-align:center;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:4px}.chip{font-size:11px;padding:1px 7px;border-radius:99px;background:var(--grnbg);color:var(--grn);font-weight:700}
.note{background:var(--ambbg);color:#5d4300;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
/* cetakan */
.doc{background:#fff;color:#000;font-family:"Times New Roman",Times,serif;border:1px solid var(--bd);border-radius:12px;padding:26px}
.doc h2.rt{text-align:center;font-size:17px;margin:0 0 2px}.doc .rs{text-align:center;font-size:12.5px;margin-bottom:12px}
.doc h3.ri{text-align:center;font-size:13.5px;text-decoration:underline;margin:16px 0 6px}
.doc .jb{border:1px solid #000;margin-bottom:10px;break-inside:avoid}.doc .jb .jh{background:#1f2430;color:#fff;font-weight:700;font-size:13px;padding:3px 8px}
.doc table{width:100%;border-collapse:collapse;font-size:11.5px;font-family:inherit}
.doc .jb td{padding:1.5px 8px}.doc .jb td.b{width:30px;text-align:right}.doc .jb td.j{width:32%;text-align:center}
.doc .kos{font-style:italic;color:#8a5a00}
.doc table.rg th,.doc table.rg td{border:1px solid #000;padding:3px 4px;font-size:10.5px;text-align:center}
.doc table.rg td.l,.doc table.rg th.l{text-align:left}.doc table.rg thead th{background:#e8e8e8}
.doc table.rg tr.gh td{background:#f1f1f1;font-weight:700;text-align:left}
.doc .rv th{writing-mode:vertical-rl;transform:rotate(180deg);height:118px;white-space:nowrap;font-weight:600}
.doc .sb{border:1px solid #000;margin-bottom:10px;break-inside:avoid}.doc .sb .sh{background:#e8e8e8;font-weight:700;padding:3px 8px;font-size:12.5px;display:flex;justify-content:space-between;gap:8px}
.doc .sb td{border-top:1px solid #ccc;padding:2px 8px;font-size:11.5px}
.surat{font-family:"Times New Roman",Times,serif;color:#000;background:#fff;font-size:13.5px;line-height:1.55;padding:28px 34px;border:1px solid var(--bd);border-radius:12px;margin-bottom:16px}
.surat .kp{display:flex;align-items:center;gap:14px;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:12px}
.surat .kp img{height:64px}.surat .kp b{font-size:15.5px;display:block}.surat .kp span{font-size:12px}
.surat table.tb{border-collapse:collapse;width:100%;margin:8px 0;font-size:12.5px}.surat table.tb th,.surat table.tb td{border:1px solid #000;padding:3px 6px;text-align:left}
.surat .rj{display:grid;grid-template-columns:110px 1fr;font-size:13px}
.surat .tj{font-weight:700;text-transform:uppercase;margin:12px 0 8px}

.mg{font-family:Arial,Helvetica,sans-serif;color:#000;background:#fff;font-size:12.5px;line-height:1.5;padding:34px 46px;border:1px solid var(--bd);border-radius:6px;margin:0 auto 16px;max-width:794px}
.mg .hd{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid #000;padding-bottom:1px}
.mg .hd b{font-size:30px;line-height:1;letter-spacing:-.5px}.mg .hd span{font-size:12.5px}
.mg table.kd{width:100%;border-collapse:collapse}.mg table.kd td{border-bottom:1px solid #000;padding:2px 4px}.mg table.kd td.k{width:110px}
.mg table.rj{width:100%;border-collapse:collapse;border-bottom:1px solid #000}.mg table.rj td{text-align:center;vertical-align:top;padding:2px 4px 8px;border-left:1px solid #000;height:52px}.mg table.rj td:first-child{border-left:0}
.mg .tj{font-weight:700;margin:12px 0}.mg p{margin:10px 0;text-align:justify}.mg .pn{display:inline-block;width:42px}
.mg .bt{display:grid;grid-template-columns:90px 14px 1fr;margin-left:100px}
.mg .lp{text-align:center;font-weight:700}
.mg table.ls{width:100%;border-collapse:collapse;margin-top:8px}.mg table.ls th{color:#5a6b85;text-align:left;font-weight:700}.mg table.ls th,.mg table.ls td{border:1px solid #999;padding:3px 6px;vertical-align:top}
.mg table.ah{width:100%;border-collapse:collapse;margin-top:14px;font-size:11.5px}.mg table.ah td{border-bottom:1px solid #b9c7da;padding:2px 4px}
.pgb{page-break-after:always}.printonly{display:none}@media print{.printonly{display:block}}
@media print{.mg{border:0;padding:0;margin:0;max-width:none}}

.ik .bh{background:#0f3d2a;color:#fff;font-weight:700;padding:9px 14px;border-radius:8px;margin:18px 0 8px;letter-spacing:.3px}
.ik .jt{font-weight:700;margin:14px 0 4px;font-size:14px}
.ik table.t{border:1px solid var(--bd);background:#fff}.ik table.t td{padding:6px 9px}
.ik .bs+.bs{break-before:page}
.ik .jw{break-inside:avoid}
@media print{.ik .bh{background:#fff;color:#000;border:1.5px solid #000;border-radius:6px}.ik table.t{border:1px solid #888}.ik table.t th,.ik table.t td{border:1px solid #888;padding:3px 6px;font-size:11.5px}.ik table.t thead th{background:#dfe8f3!important;color:#2a3b55}.ik .jt{font-size:13px;margin:10px 0 3px}.ik .kos td{background:#fff}}
@media (max-width:1100px){.g3{grid-template-columns:1fr 1fr}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;width:260px;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.4)}
  .burger{display:block}.top .who,.top>.small{display:none}.top{padding:8px 10px;gap:6px}.top .pt{font-size:14px}.top .btn2{padding:6px 8px;font-size:12px}
  .tools input,.tools select{min-width:0;flex:1 1 100%}.tools .lb{flex:0 0 auto}
  .main{padding:16px 14px 40px}.g2,.g3,.row2{grid-template-columns:minmax(0,1fr)}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat b{font-size:22px}
}
@media print{
  body{background:#fff}.side,.top,.noprint,.toast,.dlg{display:none!important}
  .app{display:block}.main{padding:0;max-width:none}
  .card{border:0;padding:0;break-inside:auto;box-shadow:none}.stat{break-inside:avoid}.doc,.surat{border:0;border-radius:0;padding:0}
  .wrap,[style*=max-height]{overflow:visible!important;max-height:none!important}
  table.t thead{display:table-header-group}table.t tr{break-inside:avoid}
  .grid{display:block}.grid>.card{margin-bottom:14px}
  .surat{page-break-after:always;margin:0}.surat:last-child{page-break-after:auto}
  table.t thead th{background:#eee!important}
  @page{margin:12mm}
}
</style>
</head>

<script>
var API_URL="https://script.google.com/macros/s/AKfycbz6Pj4j-dYiJ0AEclDvwMqm4PuJK4N-QlmzsoH0d1MQ7EaYpkxNkJzheQGjRI_nwut1Iw/exec";

/* ===== asas ===== */
var $=function(i){return document.getElementById(i)};
var TOKEN="",USER=null,D=null,PAGE="dash",TAHUN="",ST={};
try{TOKEN=sessionStorage.getItem("jk_tok")||"";USER=JSON.parse(sessionStorage.getItem("jk_usr")||"null");TAHUN=sessionStorage.getItem("jk_thn")||""}catch(e){}
var ROLE={PENTADBIR:"Pentadbir Sistem",PENYELARAS:"Penyelaras JK",PEMBANTU:"Pembantu Penyelaras"};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function fmt(n){return Number(n||0).toLocaleString("ms-MY")}
function toast(m){var t=$("toast");t.textContent=m;t.classList.remove("hide");clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.add("hide")},3800)}
function adm(){return USER&&USER.peranan==="PENTADBIR"}
function boleh(kod){return adm()||(USER&&USER.kodJk.indexOf(kod)>=0)}
var cbn=0;
function api(body){return new Promise(function(res,rej){
  if(!API_URL||API_URL.indexOf("PASTE")===0){rej(new Error("Alamat API belum ditetapkan"));return}
  var name="__jk"+Date.now().toString(36)+(cbn++),sc=document.createElement("script"),done=false;
  var t=setTimeout(function(){if(!done){fin();rej(new Error("tamat masa"))}},45000);
  function fin(){done=true;clearTimeout(t);try{delete window[name]}catch(e){window[name]=undefined}if(sc.parentNode)sc.parentNode.removeChild(sc)}
  window[name]=function(j){if(done)return;fin();if(j&&j.error==="auth"&&body.action!=="login"){sesiTamat();rej(new Error("auth"));return}res(j)};
  sc.onerror=function(){if(!done){fin();rej(new Error("rangkaian"))}};
  sc.src=API_URL+"?cb="+name+"&q="+encodeURIComponent(JSON.stringify(body));
  document.head.appendChild(sc)})}
async function sha(s){var b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(function(x){return("0"+x.toString(16)).slice(-2)}).join("")}
function hashPw(id,pw){return sha("mrsm-jk:"+id.toLowerCase()+":"+pw)}
async function tulis(body,okMsg){
  body.token=TOKEN;body.tahun=TAHUN;
  try{var j=await api(body);if(!j||!j.ok){toast((j&&j.error)||"Gagal");return j||{}}if(okMsg)toast(okMsg);await muat(true);return j}
  catch(x){if(x.message!=="auth")toast("Tidak dapat menghubungi pelayan ("+x.message+")");return{}}
}
function csv(nama,rows){var s=rows.map(function(r){return r.map(function(v){v=String(v==null?"":v);return/[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(",")}).join("\r\n");
  var a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+s],{type:"text/csv;charset=utf-8"}));a.download=nama+".csv";document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500)}
function modal(html){$("dlgBox").innerHTML=html;$("dlg").classList.remove("hide");var x=$("dlgBox").querySelector(".x");if(x)x.onclick=tutupModal}
function tutupModal(){$("dlg").classList.add("hide");$("dlgBox").innerHTML=""}

/* ===== sesi ===== */

var N={},SM={},JM={},LBL={};
function kira(){
  N={};D.pemberat.forEach(function(p){N[p.jawatan]=p.nilai});
  SM={};D.staf.forEach(function(s){s.bil=0;s.merit=0;s.k={};s.jk=[];SM[s.id]=s});
  JM={};D.jk.forEach(function(j){j.ahli=[];j.merit=0;j.kosong=0;JM[j.kod]=j});
  var exo=D.tetapan.ASING_EXOFFICIO==="YA";
  D.lantikan.forEach(function(l){var j=JM[l.kod];var w=N[l.kat]||0;l.w=w;
    if(j){j.ahli.push(l);if(!l.idStaf)j.kosong++;else j.merit+=w}
    var s=SM[l.idStaf];if(s){s.bil++;s.merit+=w;s.k[l.kat]=(s.k[l.kat]||0)+1;s.jk.push(l)}});
  var ji={};D.jk.forEach(function(j,i){ji[j.kod]=i});
  D.staf.forEach(function(s){s.jk.sort(function(a,b){return ji[a.kod]-ji[b.kod]});s.kat=katStaf(s);s.peg=s.kat==="PEMEGANG";s.exo=exo&&s.kat==="EXOFFICIO"});
  var gw=D.tetapan.JAWATAN_WAJIB||"Pengerusi|Penyelaras|Presiden|Ketua|Guru Penasihat";
  D.jk.forEach(function(j){
    var grp=String(j.wajib||gw).split(",").map(function(g){return g.split("|").map(function(x){return x.trim().toUpperCase()}).filter(Boolean)}).filter(function(g){return g.length});
    j.kurang=grp.filter(function(g){return!j.ahli.some(function(a){var as=String(a.asal).toUpperCase();return a.idStaf&&g.some(function(x){return as.indexOf(x)===0||a.kat===x})})}).map(function(g){return g.map(titleCase).join(" / ")});

PAGES.merit=function(){var cnt={};D.lantikan.forEach(function(l){cnt[l.kat]=(cnt[l.kat]||0)+1});var P=D.pemberat.map(function(p){return{jawatan:p.jawatan,nilai:p.nilai}});
  var draw=function(){$("mb").innerHTML=P.map(function(p,i){return'<tr><td><input data-i="'+i+'" data-f="jawatan" value="'+esc(p.jawatan)+'"'+(cnt[p.jawatan]?" disabled":"")+'></td><td style="width:110px"><input type="number" min="0" step="0.5" data-i="'+i+'" data-f="nilai" value="'+p.nilai+'"></td><td class="n">'+(cnt[p.jawatan]||0)+'</td><td class="small">'+esc(JAWLBL.filter(function(x){return x[1]===p.jawatan}).map(function(x){return x[0]}).join(", "))+"</td><td>"+(cnt[p.jawatan]?"":'<button class="btn2 red" data-x="'+i+'">Buang</button>')+"</td></tr>"}).join("");
    $("mb").querySelectorAll("input").forEach(function(inp){inp.oninput=function(){P[inp.dataset.i][inp.dataset.f]=inp.dataset.f==="nilai"?Number(inp.value):inp.value}});
    $("mb").querySelectorAll("[data-x]").forEach(function(b){b.onclick=function(){P.splice(Number(b.dataset.x),1);draw()}})};
  $("main").innerHTML='<div class="ttl"><div><h1>Jawatan &amp; Merit</h1><p class="small">Nilai pemberat (merit) bagi setiap kategori jawatan. Perubahan terus mengubah kiraan beban semua staf.</p></div></div><div class="card"><div class="wrap"><table class="t"><thead><tr><th>Kategori jawatan</th><th>Nilai</th><th class="n">Digunakan</th><th>Label jawatan dalam kategori ini</th><th></th></tr></thead><tbody id="mb"></tbody></table></div><div class="act" style="justify-content:space-between"><button class="btn2" id="mAdd">+ Kategori baharu</button><button class="btn" id="mSave">Simpan</button></div><div class="msg" id="mMsg"></div></div>';
  draw();$("mAdd").onclick=function(){P.push({jawatan:"",nilai:1});draw()};
  $("mSave").onclick=async function(){this.disabled=true;var r=await tulis({action:"savepemberat",list:P},"Nilai merit disimpan.");this.disabled=false;if(r.ok)PAGES.merit();else $("mMsg").textContent=r.error||"Gagal"}};

/* ===== IMPORT / EKSPORT ===== */
PAGES.impeks=function(){
  $("main").innerHTML='<div class="ttl"><div><h1>Import / Eksport</h1><p class="small">Muat turun data sebagai CSV (boleh dibuka dalam Excel), import lantikan secara pukal, atau bina data tahun baharu.</p></div></div><div class="grid g2"><div class="card"><h2>Eksport (CSV)</h2><div class="tools"><button class="btn2" id="x1">Staf</button><button class="btn2" id="x2">Jawatankuasa '+esc(TAHUN)+'</button><button class="btn2" id="x3">Lantikan '+esc(TAHUN)+'</button><button class="btn2" id="x4">Beban staf '+esc(TAHUN)+'</button><button class="btn2" id="x5">Takwim '+esc(TAHUN)+'</button></div></div>'+
  '<div class="card"><h2>Bina Data Tahun Baharu</h2><p class="small">Salin semua JK dan lantikan daripada satu tahun ke tahun baharu. Selepas itu, lantikan tahun baharu boleh diubah tanpa menjejaskan tahun asal.</p><div class="row2"><div><label>Dari tahun</label><select id="cyA">'+opt(D.tahunList,TAHUN)+'</select></div><div><label>Ke tahun</label><input id="cyB" value="'+(Number(TAHUN)+1)+'"></div></div><label style="display:flex;gap:8px;align-items:center;color:var(--tx)"><input type="checkbox" id="cyK" checked style="width:auto"> Jadikan KOSONG jawatan staf yang tidak aktif</label><button class="btn" id="cyGo" style="margin-top:10px">Salin data</button><div class="msg" id="cyMsg"></div></div></div>'+
  '<div class="card"><h2>Import Lantikan (tahun '+esc(TAHUN)+')</h2><p class="small">Tampal data CSV, satu baris setiap lantikan, dengan lajur: <b>KOD_JK, NO_GAJI atau ID_STAF, KATEGORI, JAWATAN</b>. Contoh: <code>B02,205229,AJK/ JK/ JAWATANKUASA,AHLI</code></p><textarea id="imT" style="min-height:160px" placeholder="KOD_JK,NO_GAJI,KATEGORI,JAWATAN"></textarea><div class="tools" style="margin-top:8px"><button class="btn" id="imGo">Semak &amp; import</button></div><div class="msg" id="imMsg"></div></div>';
  var ka=function(s){return s.k};
  $("x1").onclick=function(){csv("Staf",[["ID_STAF","NO_GAJI","GELARAN","NAMA","JANTINA","JABATAN","SUBJEK","JAWATAN","STATUS","GRED","EMEL","TELEFON"]].concat(D.staf.map(function(s){return[s.id,s.noGaji,s.gelaran,s.nama,s.jantina,s.jabatan,s.subjek,s.jawatan,s.status,s.gred,s.emel,s.telefon]})))};
  $("x2").onclick=function(){csv("JK_"+TAHUN,[["KOD_JK","NAMA_JK","BAHAGIAN","KUMPULAN","STATUS","AHLI","KOSONG","MERIT"]].concat(D.jk.map(function(j){return[j.kod,j.nama,j.induk,j.kumpulan,j.status,j.ahli.length,j.kosong,j.merit]})))};
  $("x3").onclick=function(){csv("Lantikan_"+TAHUN,[["ID","KOD_JK","NAMA_JK","ID_STAF","NO_GAJI","NAMA","JAWATAN","KATEGORI","MERIT"]].concat(D.lantikan.map(function(l){var s=SM[l.idStaf];return[l.id,l.kod,JM[l.kod]?JM[l.kod].nama:"",l.idStaf,s?s.noGaji:"",s?s.nama:l.nama,l.asal,l.kat,l.idStaf?l.w:0]})))};
  $("x4").onclick=function(){csv("Beban_"+TAHUN,[["NAMA","JABATAN","JAWATAN","BIL JAWATAN","MERIT"]].concat(aktifStaf().sort(function(a,b){return a.susunan-b.susunan}).map(function(s){return[s.nama,s.jabatan,s.jawatan,s.bil,s.merit]})))};
  $("x5").onclick=function(){csv("Takwim_"+TAHUN,[["TARIKH MULA","TARIKH TAMAT","ACARA","KOD JK","LOKASI","CATATAN"]].concat(D.takwim.map(function(e){return[e.mula,e.tamat,e.acara,e.kod,e.lokasi,e.catatan]})))};
  $("cyGo").onclick=async function(){var a=$("cyA").value,b=$("cyB").value.trim();if(!/^\d{4}$/.test(b)){$("cyMsg").textContent="Tahun tidak sah.";return}if(!confirm("Salin semua JK dan lantikan "+a+" ke "+b+"?"))return;this.disabled=true;
    var j=await api({action:"salintahun",token:TOKEN,dari:a,ke:b,kosongTidakAktif:$("cyK").checked});this.disabled=false;
    if(j&&j.ok){toast("Data "+b+" dibina: "+j.jk+" JK, "+j.lantikan+" lantikan.");TAHUN=b;D=null;simpanSesi();await muat(true);go("dash")}else $("cyMsg").textContent=(j&&j.error)||"Gagal"};
  $("imGo").onclick=async function(){var rows=$("imT").value.split(/\r?\n/).map(function(x){return x.split(",").map(function(c){return c.trim().replace(/^"|"$/g,"")})}).filter(function(r){return r[0]&&!/^KOD/i.test(r[0])}).map(function(r){return{kod:r[0],staf:r[1],kat:r[2],asal:r.slice(3).join(",")}});
    if(!rows.length){$("imMsg").textContent="Tiada baris.";return}if(rows.length>150){$("imMsg").textContent="Maksimum 150 baris sekali import. Pecahkan kepada beberapa kali.";return}
    this.disabled=true;var j=await api({action:"import",token:TOKEN,tahun:TAHUN,jenis:"lantikan",rows:rows});
    if(j&&!j.ok&&j.ralat){if(confirm(j.error+":\n\n"+j.ralat.slice(0,12).join("\n")+"\n\nImport "+j.sah+" baris yang sah sahaja?"))j=await api({action:"import",token:TOKEN,tahun:TAHUN,jenis:"lantikan",rows:rows,paksa:true});else{this.disabled=false;return}}
    this.disabled=false;if(j&&j.ok){$("imMsg").className="msg ok";$("imMsg").textContent=j.masuk+" lantikan diimport.";$("imT").value="";await muat(true)}else $("imMsg").textContent=(j&&j.error)||"Gagal"};
};
function salinTahunDlg(){go("impeks");setTimeout(function(){var b=$("cyB");if(b){b.focus();b.scrollIntoView({block:"center"})}},50)}

/* ===== PENGGUNA ===== */
var UD=null,editU=null;
PAGES.users=function(){
  $("main").innerHTML='<div class="ttl"><div><h1>Pengguna Sistem</h1><p class="small">Pentadbir urus akaun Penyelaras dan Pembantu. Penyelaras hanya boleh mengurus JK yang ditetapkan.</p></div></div><div class="grid g2"><div class="card"><h2 id="uHead">Tambah Pengguna</h2><div class="row2"><div><label>ID Pengguna</label><input id="fId" autocapitalize="off" placeholder="cth: hakimi"></div><div><label>Peranan</label><select id="fRole"><option value="PENYELARAS">Penyelaras</option><option value="PEMBANTU">Pembantu Penyelaras</option><option value="PENTADBIR">Pentadbir</option></select></div></div><label>Staf</label><select id="fStaf"><option value="">- pilih staf -</option>'+stafOpts("")+'</select><label>Jawatankuasa dijaga (kod dipisah koma)</label><input id="fJk" placeholder="cth: B02, C11" autocapitalize="characters"><div class="small" id="fJkName" style="margin-top:4px"></div><div class="row2"><div><label>Status</label><select id="fStatus"><option>AKTIF</option><option>TIDAK AKTIF</option></select></div><div id="fPwBox"><label>Kata laluan sementara</label><input id="fPw" autocomplete="off"></div></div><button class="btn full" id="bSave">Tambah Pengguna</button><button class="btn2 hide" id="bCancel" style="width:100%;margin-top:8px">Batal</button><div class="msg" id="umsg"></div></div><div class="card"><h2>Senarai Pengguna</h2><div class="wrap"><table class="t"><thead><tr><th>ID</th><th>Nama / Peranan</th><th>JK</th><th></th></tr></thead><tbody id="tUsers"><tr><td colspan="4" class="small">Memuatkan...</td></tr></tbody></table></div></div></div>';
  $("fJk").oninput=function(){var ks=this.value.toUpperCase().split(/[,\s]+/).filter(Boolean);$("fJkName").innerHTML=ks.map(function(k){return JM[k]?esc(k)+": "+esc(JM[k].nama):'<span style="color:var(--red)">'+esc(k)+": kod tidak wujud</span>"}).join("<br>")};
  $("bCancel").onclick=uReset;$("bSave").onclick=uSave;muatUsers()};
async function muatUsers(){try{var j=await api({action:"users",token:TOKEN});if(!j.ok)throw new Error(j.error);UD=j;
  $("tUsers").innerHTML=j.users.map(function(u){return"<tr><td><b>"+esc(u.id)+"</b>"+(u.status!=="AKTIF"?'<br><span class="tag t-hi">Tidak aktif</span>':"")+"</td><td>"+esc(u.nama)+'<br><span class="small">'+esc(ROLE[u.peranan]||u.peranan)+(u.akhir?" · log masuk "+new Date(u.akhir).toLocaleDateString("ms-MY"):"")+'</span></td><td><div class="chips">'+(u.kodJk.length?u.kodJk.map(function(k){return'<span class="chip">'+esc(k)+"</span>"}).join(""):'<span class="small">Semua</span>')+'</div></td><td style="white-space:nowrap"><button class="btn2" data-ed="'+esc(u.id)+'">Ubah</button> <button class="btn2" data-rs="'+esc(u.id)+'">Reset</button></td></tr>'}).join("");
  $("tUsers").querySelectorAll("[data-ed]").forEach(function(b){b.onclick=function(){uEdit(b.dataset.ed)}});
  $("tUsers").querySelectorAll("[data-rs]").forEach(function(b){b.onclick=function(){uReset2(b.dataset.rs)}})}
  catch(x){if(x.message!=="auth")$("tUsers").innerHTML='<tr><td colspan="4" class="msg">Gagal memuatkan.</td></tr>'}}
function uReset(){editU=null;$("fId").value="";$("fId").disabled=false;$("fRole").value="PENYELARAS";$("fStaf").value="";$("fJk").value="";$("fStatus").value="AKTIF";$("fPw").value="";$("fPwBox").classList.remove("hide");$("bSave").textContent="Tambah Pengguna";$("uHead").textContent="Tambah Pengguna";$("bCancel").classList.add("hide");$("fJkName").textContent="";$("umsg").textContent=""}
function uEdit(id){var u=UD.users.filter(function(x){return x.id===id})[0];editU=id;$("fId").value=u.id;$("fId").disabled=true;$("fRole").value=u.peranan;$("fStaf").value=u.idStaf||"";$("fJk").value=u.kodJk.join(", ");$("fStatus").value=u.status||"AKTIF";$("fPwBox").classList.add("hide");$("bSave").textContent="Simpan Perubahan";$("uHead").textContent="Ubah Pengguna: "+id;$("bCancel").classList.remove("hide");$("fJk").oninput();window.scrollTo(0,0)}
async function uSave(){var m=$("umsg");m.className="msg";m.textContent="";var id=$("fId").value.trim().toLowerCase(),sid=$("fStaf").value;
  if(!/^[a-z0-9._-]{1,30}$/.test(id)){m.textContent="ID hanya huruf kecil, nombor, titik, _ atau -.";return}if(!sid){m.textContent="Sila pilih staf.";return}
  var data={id:id,nama:SM[sid]?SM[sid].nama:"",idStaf:sid,peranan:$("fRole").value,kodJk:$("fJk").value,status:$("fStatus").value};
  if(!editU){var pw=$("fPw").value;if(pw.length<8){m.textContent="Kata laluan sementara sekurang-kurangnya 8 aksara.";return}data.h=await hashPw(id,pw)}
  $("bSave").disabled=true;try{var j=await api({action:"saveuser",token:TOKEN,baru:!editU,data:data});if(j.ok){var t=editU?"Perubahan disimpan.":"Pengguna "+id+" ditambah. Beri ID dan kata laluan sementara kepada pengguna.";uReset();m.className="msg ok";m.textContent=t;muatUsers()}else m.textContent=j.error||"Gagal"}catch(x){}$("bSave").disabled=false}
async function uReset2(id){var pw=prompt("Kata laluan sementara baharu untuk "+id+" (sekurang-kurangnya 8 aksara):");if(pw===null)return;if(pw.length<8){toast("Terlalu pendek.");return}
  var j=await api({action:"resetpw",token:TOKEN,id:id,h:await hashPw(id,pw)});toast(j&&j.ok?"Kata laluan "+id+" direset.":"Gagal reset.")}

/* ===== TETAPAN ===== */
var TLBL=[["NAMA_MAKTAB","Nama penuh maktab"],["NAMA_RINGKAS","Nama ringkas (dalam surat, cth: MRSM ARAU)"],["BANDAR","Bandar (bawah tandatangan)"],["ALAMAT","Alamat"],["TAHUN_AKTIF","Tahun aktif (dibuka secara lalai)"],["JAWATAN_WAJIB","Jawatan wajib global untuk JK lengkap (koma = semua perlu, | = salah satu)"],["AMBANG_TINGGI","Ambang beban tinggi (× purata kategori, cth 1.3 = 130%)"],["AMBANG_RENDAH","Ambang beban rendah (× purata kategori, cth 0.5 = 50%)"],["ASING_EXOFFICIO","Asingkan Pengetua & TP daripada analisis (YA/TIDAK)"],["RUJUKAN_SURAT","Awalan rujukan surat"],["PENANDATANGAN_NAMA","Penandatangan surat lantikan (nama)"],["PENANDATANGAN_JAWATAN","Jawatan penandatangan"],["SLOGAN","Slogan surat (satu baris setiap slogan)"]];
PAGES.tetapan=function(){
  $("main").innerHTML='<div class="ttl"><div><h1>Tetapan</h1><p class="small">Tetapan umum sistem, ambang beban dan teks surat.</p></div></div><div class="card">'+TLBL.map(function(x){var v=D.tetapan[x[0]]||"",big=x[0]==="SLOGAN";return"<label>"+esc(x[1])+"</label>"+(big?'<textarea data-k="'+x[0]+'">'+esc(v)+"</textarea>":x[0]==="ASING_EXOFFICIO"?'<select data-k="'+x[0]+'">'+opt(["YA","TIDAK"],v)+"</select>":'<input data-k="'+x[0]+'" value="'+esc(v)+'">')}).join("")+'<div class="act"><button class="btn" id="tSave">Simpan Tetapan</button></div><div class="msg" id="tMsg"></div></div>';
  $("tSave").onclick=async function(){var d={};document.querySelectorAll("[data-k]").forEach(function(i){d[i.dataset.k]=i.value});this.disabled=true;var r=await tulis({action:"savetetapan",data:d},"Tetapan disimpan.");this.disabled=false;if(!r.ok)$("tMsg").textContent=r.error||"Gagal";else PAGES.tetapan()}};

/* ===== LOG AUDIT ===== */
PAGES.log=function(){
  $("main").innerHTML='<div class="ttl"><div><h1>Log Audit</h1><p class="small">Rekod 500 tindakan terkini dalam sistem.</p></div><button class="btn2" id="lgcsv">⬇ CSV</button></div><div class="card"><div class="tools"><input id="lgq" placeholder="Cari pengguna, tindakan atau butiran..."></div><div class="wrap"><table class="t"><thead><tr><th>Masa</th><th>Pengguna</th><th>Tindakan</th><th>Butiran</th></tr></thead><tbody id="lgb"><tr><td colspan="4" class="small">Memuatkan...</td></tr></tbody></table></div></div>';
  api({action:"log",token:TOKEN,limit:500}).then(function(j){var L=j.log||[];
    var draw=function(){var q=$("lgq").value.toUpperCase();$("lgb").innerHTML=L.filter(function(x){return!q||(x.id+" "+x.nama+" "+x.tindakan+" "+x.butiran).toUpperCase().indexOf(q)>=0}).map(function(x){return'<tr><td class="small" style="white-space:nowrap">'+esc(new Date(x.masa).toLocaleString("ms-MY"))+"</td><td>"+esc(x.id)+'<div class="small">'+esc(x.nama)+'</div></td><td><span class="tag t-bl">'+esc(x.tindakan)+'</span></td><td class="small">'+esc(x.butiran)+"</td></tr>"}).join("")||'<tr><td colspan="4" class="small">Tiada rekod.</td></tr>'};
    $("lgq").oninput=draw;draw();$("lgcsv").onclick=function(){csv("Log_Audit",[["MASA","PENGGUNA","NAMA","TINDAKAN","BUTIRAN"]].concat(L.map(function(x){return[x.masa,x.id,x.nama,x.tindakan,x.butiran]})))}}).catch(function(){})};

/* ===== mula ===== */
if(TOKEN&&USER)masuk();else show("vLogin");
</script>
